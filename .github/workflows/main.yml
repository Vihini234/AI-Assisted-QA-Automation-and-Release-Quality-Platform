
name: AI-Assisted QA Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  automation-tests:
    name: Run API and UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run automation tests
        run: xvfb-run -a mvn -B clean test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-results
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 14
